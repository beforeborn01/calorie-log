spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

app:
  auth:
    # ⚠️ 临时方案：真实 SMS/Mail 通道接入前，prod 也走固定码 123456
    # 整个发码 / 校验链路保持不变，只是不发短信、固定值。接入 SmsService 后请改回 false。
    mock-verify-code: "123456"
    mock-verify-code-enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    com.calorielog: INFO
