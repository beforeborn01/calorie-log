# HTTPS server —— 仅当容器启动时检测到 /etc/nginx/ssl/fullchain.pem 才会启用
# （由 docker-entrypoint.d/10-enable-ssl.sh 拷到 /etc/nginx/conf.d/）
#
# 启用后：
#   - 80 端口除 /.well-known/acme-challenge/ 外全部 301 到 443
#   - 443 提供 SPA + /api/ 反代（与 80 server 一致）
#
# 证书路径约定（容器内）：
#   /etc/nginx/ssl/fullchain.pem
#   /etc/nginx/ssl/privkey.pem
# 由宿主机的 ./ssl/<domain>/ 挂载进来

server {
    listen 443 ssl;
    http2 on;
    # SERVER_NAME 由 entrypoint 用环境变量 DOMAIN 替换
    server_name __DOMAIN__;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # 现代 SSL 配置（A 评级），参考 Mozilla intermediate
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS（先 6 个月，确认正常再考虑 1 年 + preload）
    add_header Strict-Transport-Security "max-age=15552000" always;

    # 复用 default.conf 里定义的 clog_main 格式（token/refresh 已脱敏）
    access_log /var/log/nginx/access.log clog_main;

    client_max_body_size 10M;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    location ~* ^/assets/.+\.(js|css|svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 动作库演示图（开练抓取，宿主 ./exercise-img 挂载到此）。^~ 优先于 SPA 兜底，
    # 缺图返回 404 而非 index.html。
    location ^~ /img/exercises/ {
        alias /usr/share/nginx/html/img/exercises/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # Meet API：通过共享 bc-edge 网络访问 meet-app，不再暴露宿主机 9915。
    # proxy_pass 不带 URI，完整保留 /meet/api/... 路径给 Spring Boot。
    location ^~ /meet/api/ {
        proxy_pass http://meet-app:9915;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        client_max_body_size 15m;
    }

    # Meet 头像仍由 Spring Boot 的 /uploads/** 静态资源映射提供。
    # 仅占用 avatars 子目录，避免影响主站未来可能使用的 /uploads。
    location ^~ /uploads/avatars/ {
        proxy_pass http://meet-app:9915;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Meet 法律与合规页面：隐私政策、用户协议和账号删除页面。
    location ^~ /meet/legal/ {
        proxy_pass http://meet-app:9915;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Budget 项目 API 反代：同域名下用 /budget/api/ 与 calorie-log 的 /api/ 区分
    location ^~ /budget/api/ {
        proxy_pass http://budget-app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    location /api/ {
        # clog-app：calorie-log app 的唯一别名。不可用 `app`——它在共享网络
        # bc-edge 上与 budget 服务同名，会被解析到 budget 容器（→ 40100）。
        proxy_pass http://clog-app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    location /actuator/ {
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://clog-app:8080;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
