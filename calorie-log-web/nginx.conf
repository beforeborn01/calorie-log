# 食养记前端 nginx 配置
#   - / 静态 SPA
#   - /api/ 反向代理到后端 Spring Boot 容器（service 名 app）
#   - /actuator 默认关闭（只给同网段 docker 内使用）
#   - 80 端口默认提供 HTTP；若挂载了证书（/etc/nginx/ssl/fullchain.pem + privkey.pem）
#     则 docker-entrypoint 会启用 ssl.conf，把 80 重定向到 443。
#     证书未挂载时 ssl.conf 里的 server_name 用 localhost 占位即可。

# ---------- 公共 SPA + /api 反代逻辑 ----------
# 抽成 snippet 方便 80/443 共享；但 nginx 没有原生 include-once，所以这里
# 在 80 server 里直接展开；443 server 在 conf.d/ssl.conf 里展开同样片段。

# 把 token / refresh 这类敏感 query 从 access log 中抹掉。
# 小程序 web-view 套壳启动时会瞬间携带 ?token=...&refresh=... 进入 web
# （main.tsx 立刻 history.replaceState 清掉，但 nginx 已经记到 access.log）。
# 一旦命中任一敏感 key 就整段 query 替换为 "redacted"，宁可丢点上下文，也不留 token。
map $args $loggable_args {
    default                  $args;
    ~*(^|&)(token|refresh)=  "redacted";
}
log_format clog_main '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri$is_args$loggable_args $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;

    # 用脱敏后的 log_format 覆盖镜像默认（official nginx.conf 在 http 级有 access_log；
    # 一旦 server 块自己定义 access_log，http 级的会被屏蔽，从而只走脱敏版本）
    access_log /var/log/nginx/access.log clog_main;

    # AI 识别图片上传 ≤ 2MB；留余量
    client_max_body_size 10M;

    # ACME http-01 challenge：放行给 certbot/acme.sh 用
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/certbot;
    }

    # 容器 healthcheck 探针：始终走 80 不被 redirect 到 443，避免容器内 wget 跟证书 SAN 不匹配
    location = /healthz {
        access_log off;
        default_type "text/plain";
        return 200 "ok\n";
    }

    # 若开启了 HTTPS（环境变量 ENABLE_HTTPS=1），则除了 challenge 之外都 301 到 https
    # —— 通过 docker-entrypoint 注入 conf.d/redirect.conf 实现。这里默认配置不做强制重定向，
    # 这样在 SSL 证书还没申请下来的窗口期，前端依然可访问。

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # 静态资源：hash 文件名，强缓存
    location ~* ^/assets/.+\.(js|css|svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API 反代

    # Budget 项目 API 反代：同域名下用 /budget/api/ 与 calorie-log 的 /api/ 区分
    location ^~ /budget/api/ {
        proxy_pass http://budget-app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # actuator 仅允许 docker 内网访问
    location /actuator/ {
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://app:8080;
    }

    # SPA history fallback
    location / {
        try_files $uri $uri/ /index.html;
        # index.html 本身不要强缓存，避免前端更新后浏览器拿旧版
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
